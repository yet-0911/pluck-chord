<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彈撥和弦指法</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* 版面：上方定弦列 → 模式分頁 → 寬螢幕左側指板、右側控制與結果；手機依序堆疊 */
:root{
  --bg:#EAF0EE; --panel:#F8FBFA; --cell:#E1E9E6; --line:#C6D3CF;
  --ink:#172526; --muted:#5A6C69;
  --accent:#2C5A88; --accent-ink:#FFFFFF; --accent-soft:#D5E1EE;
  --gold:#C08A12; --gold-soft:#F4E6C2;
  --ok:#2A7A4C; --ok-soft:#DCEFE3; --bad:#B03838; --bad-soft:#F6DEDC;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --panel:#152024; --cell:#1B292D; --line:#2B3C40;
  --ink:#E2ECE9; --muted:#8FA3A0;
  --accent:#7EA7D4; --accent-ink:#0E1618; --accent-soft:#233850;
  --gold:#E2B24C; --gold-soft:#3B3220;
  --ok:#6CC28E; --ok-soft:#1C3527; --bad:#E57C7C; --bad-soft:#3E2224;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1618; --panel:#152024; --cell:#1B292D; --line:#2B3C40;
  --ink:#E2ECE9; --muted:#8FA3A0;
  --accent:#7EA7D4; --accent-ink:#0E1618; --accent-soft:#233850;
  --gold:#E2B24C; --gold-soft:#3B3220;
  --ok:#6CC28E; --ok-soft:#1C3527; --bad:#E57C7C; --bad-soft:#3E2224;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-display);font-size:1.6rem;margin:0;letter-spacing:.04em;text-wrap:balance}
.top p{margin:.1rem 0 0;color:var(--muted);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);letter-spacing:.04em}
select,input[type=number]{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.setup{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.strs{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.strs label.f{width:74px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:.9rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sq{width:34px;height:34px;padding:0;font-size:1.1rem}
details.rules{flex-basis:100%;border-top:1px dashed var(--line);padding-top:10px}
details.rules summary{cursor:pointer;font-weight:500;font-size:.92rem}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.rgrid .hint{font-size:.74rem;color:var(--muted);letter-spacing:0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.chk input{margin-top:4px;accent-color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--cell);padding:4px;border-radius:10px;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;padding:9px 10px;border-radius:7px;font-size:.93rem;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"ctrl" "board" "res"}
@media (min-width:860px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-areas:"board ctrl" "board res";align-items:start}
  .boardp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
}
.ctrl{grid-area:ctrl}.boardp{grid-area:board}.res{grid-area:res}
h2{font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:500}
.sub{margin-top:14px}
/* 簡譜 */
.jp{display:inline-flex;align-items:center;line-height:1}
.jp i{font-style:normal;font-size:.7em;margin-right:1px;transform:translateY(-.35em)}
.jp b{position:relative;font-weight:700;font-variant-numeric:tabular-nums}
.jp u{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-decoration:none;font-size:.32em;line-height:.9;gap:1px}
.jp u.up{bottom:100%;padding-bottom:2px;flex-direction:column-reverse}
.jp u.dn{top:100%;padding-top:2px}
/* 按鍵 */
.keys{display:grid;gap:5px}
.k12{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (min-width:480px){.k12{grid-template-columns:repeat(12,minmax(0,1fr))}}
.key{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:10px 0 12px;font-size:1.05rem;display:flex;justify-content:center}
.key.acc{background:var(--cell)}
.key.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.key:disabled{opacity:.25;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px}
.pad .row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-bottom:3px}
.pad .key{padding:12px 0 13px;font-size:.95rem;border-radius:6px}
.pad .row .key small{display:none}
/* 指板 */
.bhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bscroll{max-height:70vh;overflow:auto;border-radius:8px}
@media (min-width:860px){.bscroll{max-height:calc(100vh - 150px)}}
.fb{display:grid;gap:0;min-width:240px}
.fb .h{position:sticky;top:0;z-index:2;background:var(--panel);text-align:center;padding:4px 2px 6px;font-size:.78rem;color:var(--muted);border:0;display:flex;flex-direction:column;align-items:center;gap:1px}
.fb .h strong{color:var(--ink);font-size:.9rem}
.fb .h .mute{color:var(--bad);font-weight:700}
.fb .lab{font-size:.72rem;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-variant-numeric:tabular-nums}
.fb .c{position:relative;height:40px;border:0;border-bottom:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);padding:0}
.fb .c::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.fb .c.r0{border-bottom:4px double var(--ink)}
.fb .c.oct{border-bottom-color:var(--muted);border-bottom-style:dashed}
.fb .c .dot{position:relative;z-index:1;min-width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel)}
.fb .c.tone .dot{background:var(--gold-soft);color:var(--ink)}
.fb .c.root .dot{box-shadow:inset 0 0 0 2px var(--gold)}
.fb .c.on .dot{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.fb .c.dim .dot{opacity:.35}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;background:var(--sw)}
/* 結果 */
.status{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:700}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status .big{font-size:1.15rem}
ul.probs{margin:8px 0 0;padding-left:1.2em;color:var(--bad);font-size:.88rem}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.vc{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.vc.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.vc.fail{border-style:dashed}
.vstr{display:grid;gap:4px}
.vstr div{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel);border-radius:6px;padding:6px 0 10px}
.vstr .fr{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.vstr .n{font-size:1.1rem;min-height:1.2em}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--cell);color:var(--muted)}
.tag.gold{background:var(--gold-soft);color:var(--ink)}
.meta{font-size:.85rem;color:var(--muted)}
.cname{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cname small{font-size:.8rem;color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.picked{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:1.3rem;min-height:2.4rem;padding:4px 0}
.ln{font-weight:700;white-space:nowrap}
.ln small{font-size:.68em;font-weight:500;margin-left:1px}
.txtin{display:flex;gap:6px;margin-top:10px}
.txtin input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:180px;font:inherit;font-size:.95rem;line-height:1.7;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:.85rem;margin:6px 0 0}
.help{font-size:.82rem;color:var(--muted);margin:6px 0 0;line-height:1.6}
.help code{background:var(--cell);border-radius:4px;padding:0 4px;font-size:.95em}
.seq{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.srow.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.srow.bad{border-color:var(--bad)}
.srow .no{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.srow .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.srow .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:1.1rem}
.pill{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--gold-soft);color:var(--ink);font-weight:700}
.summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fname{font-size:.85rem;color:var(--muted);word-break:break-all}
.mhead{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin:10px 0 2px;font-weight:700}
.mhead:first-child{margin-top:0}
.sugg{font-size:.85rem;background:var(--gold-soft);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.sugg b{font-weight:700}
.beat{font-size:.78rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tag.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>彈撥和弦指法</h1>
    <p>改定弦、找和弦按法，檢查寫出來的伴奏和弦到底按不按得到</p>
  </header>

  <section class="panel setup" id="setup"></section>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="chord">和弦找按法</button>
    <button role="tab" data-tab="pitch">指定音高檢查</button>
    <button role="tab" data-tab="seq">和弦進行</button>
    <button role="tab" data-tab="score">匯入樂譜</button>
    <button role="tab" data-tab="free">自由按</button>
  </nav>

  <div class="main">
    <section class="panel ctrl" id="ctrl"></section>
    <section class="panel boardp" id="board"></section>
    <section class="panel res" id="res"></section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const LETTERS=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const KEYS=['C','♯C','D','♭E','E','F','♯F','G','♭A','A','♭B','B'];
const DEG=['1','#1','2','b3','3','4','#4','5','#5','6','b7','7'];
const CN=['一','二','三','四','五','六'];
const NOASSIGN='這幾個音只有同一條弦彈得到，沒辦法分到不同的弦上同時發聲。';
const PRESETS={
  '中阮':[43,50,55,62],
  '大阮':[38,45,50,57],
  '柳琴':[55,62,67,74],
  '琵琶':[45,50,52,57],
};
const TYPES={
  maj:{n:'大三',s:'',iv:[0,4,7]}, min:{n:'小三',s:'m',iv:[0,3,7]},
  dim:{n:'減三',s:'dim',iv:[0,3,6]}, aug:{n:'增三',s:'aug',iv:[0,4,8]},
  sus2:{n:'掛二',s:'sus2',iv:[0,2,7]}, sus4:{n:'掛四',s:'sus4',iv:[0,5,7]},
  '7':{n:'屬七',s:'7',iv:[0,4,7,10]}, maj7:{n:'大七',s:'maj7',iv:[0,4,7,11]},
  m7:{n:'小七',s:'m7',iv:[0,3,7,10]}, m7b5:{n:'半減七',s:'m7♭5',iv:[0,3,6,10]},
  dim7:{n:'減七',s:'dim7',iv:[0,3,6,9]}, '6':{n:'大六',s:'6',iv:[0,4,7,9]},
  m6:{n:'小六',s:'m6',iv:[0,3,7,9]}, add9:{n:'加九',s:'add9',iv:[0,4,7,2]},
};
const DEF={preset:'中阮',key:2,strings:[43,50,55,62],maxFret:15,maxSpan:5,cross:1,maxFingers:4,minSound:3,barre:true,skipInner:false,omit5:true,rootBass:false,tab:'chord',root:0,type:'maj',picks:[],free:[-1,0,0,-1],selIdx:0,
  nameMode:'jp',moveWarn:4,seqSel:0,
  partIdx:0,xOct:0,tempo:0,fastGap:0.25,onlyIssues:false,scoreSel:0,
  seqText:'// 範例：每行一個和弦，換成你譜上的音\nG3 Bb3 Eb4\nG3 C4 Eb4\nAb3 C4 F4\nF3 Bb3 D4\nG3 Bb3 Eb4'};
function load(){try{return JSON.parse(localStorage.getItem('pluckchord.v1')||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem('pluckchord.v1',JSON.stringify(st))}catch(e){}}
const st=Object.assign({},DEF,load());
if(!Array.isArray(st.free)||st.free.length!==st.strings.length) st.free=st.strings.map(()=>0);

const $=s=>document.querySelector(s);
const N=()=>st.strings.length;
const sLabel=i=>CN[N()-1-i]+'弦';
const letter=m=>LETTERS[((m%12)+12)%12]+(Math.floor(m/12)-1);
const accSym=a=>a==='#'?'♯':a==='b'?'♭':'';
const FLAT_KEYS=[1,3,5,8,10];
const SH=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FL=['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const pcName=pc=>(FLAT_KEYS.includes(st.key)?FL:SH)[((pc%12)+12)%12];
const lnHTML=m=>`<span class="ln">${pcName(m)}<small>${Math.floor(m/12)-1}</small></span>`;
function jp(m){return st.nameMode==='letter'?lnHTML(m):jpRaw(m)}
function degHTML(off){return st.nameMode==='letter'?`<span class="ln">${pcName(st.key+off)}</span>`:degRaw(off)}
/* 解析文字輸入：音名 G4 Bb4 C#5，或簡譜 3 5 1'（' 高八度、, 低八度） */
const LBASE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function parseToken(t){
  let m=t.match(/^([A-Ga-g])(#|♯|b|♭|x)?(-?\d)$/);
  if(m){const acc=m[2]?({'#':1,'♯':1,'b':-1,'♭':-1,'x':2})[m[2]]:0;return LBASE[m[1].toUpperCase()]+acc+(+m[3]+1)*12}
  m=t.match(/^([#♯b♭]?)([1-7])(['’,，.]*)$/);
  if(m){const acc=m[1]?(/[#♯]/.test(m[1])?1:-1):0;const up=(m[3].match(/['’]/g)||[]).length,dn=(m[3].match(/[,，.]/g)||[]).length;
    return 60+st.key+[0,2,4,5,7,9,11][+m[2]-1]+acc+12*(up-dn)}
  return null;
}
function parseNotes(str){
  const notes=[],bad=[];
  str.trim().split(/[\s、]+/).filter(Boolean).forEach(t=>{const v=parseToken(t);if(v===null)bad.push(t);else if(!notes.includes(v))notes.push(v)});
  return {notes:notes.sort((a,b)=>a-b),bad};
}
function degRaw(off){const l=DEG[((off%12)+12)%12];const a=l.length>1?accSym(l[0]):'';return `<span class="jp">${a?`<i>${a}</i>`:''}<b>${l.slice(-1)}</b></span>`}
function jpRaw(m){
  const t=60+st.key, rel=m-t, oct=Math.floor(rel/12), d=((rel%12)+12)%12;
  const l=DEG[d], a=l.length>1?accSym(l[0]):'';
  const dots=k=>Array(k).fill('<span>●</span>').join('');
  return `<span class="jp">${a?`<i>${a}</i>`:''}<b>${l.slice(-1)}${oct>0?`<u class="up">${dots(oct)}</u>`:''}${oct<0?`<u class="dn">${dots(-oct)}</u>`:''}</b></span>`;
}
function chordName(rootPc,typeKey){
  const T=TYPES[typeKey];
  return `${degHTML(rootPc-st.key)}<span>${T.s}</span> <small>${LETTERS[rootPc]}${T.s}・${T.n}</small>`;
}

/* ---------- 可按性判斷 ---------- */
function check(fr,attackMask){
  const probs=[], fretted=[];
  fr.forEach((f,i)=>{if(f>0)fretted.push({i,f})});
  const sounding=fr.map((f,i)=>f>=0?i:-1).filter(i=>i>=0);
  const plucked=attackMask?sounding.filter(i=>attackMask[i]):sounding;
  if(!st.skipInner&&plucked.length>1){
    const gap=[];for(let i=plucked[0];i<=plucked[plucked.length-1];i++)if(!plucked.includes(i))gap.push(sLabel(i));
    if(gap.length)probs.push(`要跳過中間的${gap.join('、')}不彈`);
  }
  if(!fretted.length) return {ok:!probs.length,probs,fingers:0,span:0,pos:0,barre:false,sounding};
  const fs=fretted.map(x=>x.f), min=Math.min(...fs), max=Math.max(...fs), span=max-min;
  if(span>st.maxSpan) probs.push(`上下跨度 ${span} 個半音，超過上限 ${st.maxSpan}`);
  let worst=null;
  for(let a=0;a<fretted.length;a++)for(let b=a+1;b<fretted.length;b++){
    const A=fretted[a],B=fretted[b],k=Math.abs(A.i-B.i);
    if(k<2)continue;
    const allow=st.maxSpan-st.cross*(k-1), d=Math.abs(A.f-B.f);
    if(d>allow&&(!worst||d-allow>worst.over)) worst={A,B,k,d,allow,over:d-allow};
  }
  if(worst){const hi=Math.max(worst.A.i,worst.B.i),lo=Math.min(worst.A.i,worst.B.i);
    probs.push(`${sLabel(hi)}和${sLabel(lo)}中間隔 ${worst.k-1} 條弦，品差 ${worst.d} 個半音（這個橫向距離最多 ${fmt(worst.allow)}）`);}
  const groups={};fretted.forEach(x=>{(groups[x.f]=groups[x.f]||[]).push(x.i)});
  let fingers=0,barre=false;

  const ev=a.ev,start=Math.min(from||0,ev.length-1),t0=ev[start].t,base=c.currentTime+.15,timers=[];
  const q=60/a.bpm;let endAt=base;
  ev.slice(start).forEach(e=>{
    const when=base+(e.t-t0)*q;
    [...e.att].sort((x,y)=>x-y).forEach((m,k)=>pluck(m,when+k*.012,gain));
    timers.push(setTimeout(()=>followEvent(e.i),Math.max(0,(when-c.currentTime)*1000)));
    endAt=when;
  });
  timers.push(setTimeout(stopPlay,Math.max(0,(endAt-c.currentTime)*1000)+1800));
  PLAY={gain,timers};updatePlayBtns();
}
function followEvent(i){
  if(st.tab!=='score'||!current.ana)return;
  st.scoreSel=i;const e=current.ana.ev[i];
  current.sel=e?.chosen?.frets||null;current.seqNotes=e?e.midis:[];
  const sc=$('#bscroll')?.scrollTop;renderBoard();scrollToSel(sc);
  document.querySelectorAll('.srow.sel').forEach(x=>x.classList.remove('sel'));
  const row=document.querySelector(`[data-ev="${i}"]`);
  if(row){row.classList.add('sel');if(window.matchMedia('(min-width:860px)').matches)row.scrollIntoView({block:'nearest'})}
}

function playSeq(items){const c=actx();if(!c)return;let t=c.currentTime+.05;items.forEach(it=>{if(it.chosen)strum(it.chosen.frets,t);t+=.9})}

function renderBoard(){

  if(st.tab==='seq'||st.tab==='score')exact=new Set(current.seqNotes);
  let h=`<div class="fb" style="grid-template-columns:40px repeat(${n},minmax(0,1fr))"><div class="h"></div>`;
  for(let i=0;i<n;i++){const m=sel&&sel[i]<0;h+=`<button class="h" data-head="${i}"><span>${sLabel(i)}</span><strong>${letter(st.strings[i])}</strong>${m?'<span class="mute">× 不彈</span>':'<span>&nbsp;</span>'}</button>`}
  for(let f=0;f<=st.maxFret;f++){
    h+=`<div class="lab">${f===0?'空弦':f}</div>`;
    for(let i=0;i<n;i++){
      const m=st.strings[i]+f,pc=m%12,cls=['c'];
      if(f===0)cls.push('r0');else if(f%12===0)cls.push('oct');
      if(tones.has(pc))cls.push('tone');if(pc===rootPc)cls.push('root');
      if(exact.has(m))cls.push('tone');
      if(sel&&sel[i]===f)cls.push('on');

      h+=`<button class="${cls.join(' ')}" data-cell="${i},${f}" aria-label="${sLabel(i)} ${f} ${letter(m)}"><span class="dot">${jp(m)}</span></button>`;
    }
  }
  h+='</div>';

    <div class="vstr" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cells}</div>

}

        const tags=[r.pos?`把位 ${r.pos}`:'空弦位',`${r.fingers} 指`];if(r.barre)tags.push('橫按');
        const mv=i>0&&it.move?`<span class="tag${it.warn?' warn':''}">換把 ${it.move} 個半音</span>`:'';
        detail=`<div class="vstr" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cells}</div><div class="tags">${mv}${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
      }
      const ids=identify(it.notes.map(m=>m%12));
      const nameTxt=ids.length?`<span class="meta">${ids[0].root!==undefined?`${degHTML(ids[0].root-st.key)}${TYPES[ids[0].k].s}`:''}</span>`:'';
      h+=`<button class="srow${i===st.seqSel?' sel':''}${!it.chosen?' bad':''}" data-seq="${i}"><span class="no">${i+1}</span><span class="body"><span class="top">${it.notes.map(m=>jp(m)).join(' ')} ${nameTxt} ${status}</span>${detail}</span></button>`;
    });
    el.innerHTML=h+'</div>';
  }else if(st.tab==='score'){
    const a=current.ana;
    if(!a){el.innerHTML=`<h2>結果</h2><p class="empty">選擇 MuseScore 匯出的 MusicXML 檔，或先按「載入範例」看看報告長什麼樣子。</p>`;return}
    const ev=a.ev,n=N();
    if(!ev.length){el.innerHTML=`<h2>結果</h2><p class="empty">「${partLabel(a.part)}」這個聲部沒有任何音。</p>`;return}
    const cnt=k=>ev.filter(k).length;
    const bad=cnt(e=>!e.chosen),fast=cnt(e=>e.fast),big=cnt(e=>e.big&&!e.fast),hb=cnt(e=>e.heldBreak);
    let h=`<div class="summary"><span class="pill ${bad?'bad':'ok'}">${ev.length-bad} / ${ev.length} 個時間點按得到</span>
      ${fast?`<span class="tag bad">${fast} 處換把太快</span>`:''}${big?`<span class="tag warn">${big} 處換把較遠</span>`:''}${hb?`<span class="tag warn">${hb} 處持續音要換弦</span>`:''}</div>
      <p class="meta" style="margin:0 0 10px">「${partLabel(a.part)}」・速度 ${a.bpm}。每個時間點都挑了跟前後最順的按法，單音旋律也會標出建議把位。點任一行可以在指板上看並聽聲音。</p><div class="seq">`;
    let lastM=null,shown=0;
    ev.forEach((e,i)=>{
      if(st.onlyIssues&&!e.issue)return;
      shown++;
      if(e.measure!==lastM){h+=`<div class="mhead">第 ${e.measure} 小節</div>`;lastM=e.measure}
      const beat=Math.abs(e.beat-Math.round(e.beat))<.01?Math.round(e.beat):e.beat.toFixed(2);
      let status='',detail='';
      if(!e.midis.length){status='<span class="meta">休止</span>'}
      else if(e.res.tooMany){status='<span class="pill bad">按不到</span>';detail=`<p class="err" style="margin:0">同時有 ${e.midis.length} 個音，但只有 ${n} 條弦</p>`}
      else if(e.res.unreach.length){status='<span class="pill bad">超出音域</span>';detail=`<p class="err" style="margin:0">${e.res.unreach.map(m=>jp(m)).join(' ')} 沒有弦彈得到，可能要調整「記譜與實音」</p>`}
      else if(!e.chosen){status='<span class="pill bad">按不到</span>';const f=e.res.fail[0];detail=f?`<ul class="probs" style="margin:0">${f.r.probs.map(p=>`<li>${p}</li>`).join('')}</ul>`:`<p class="err" style="margin:0">${NOASSIGN}</p>`}
      else{
        const v=e.chosen,r=v.r;let cells='';
        for(let s=0;s<n;s++){const f=v.frets[s];cells+=`<div><span class="fr">${sLabel(s)}・${f<0?'×':f===0?'空':f}</span><span class="n">${f<0?'':jp(st.strings[s]+f)}</span></div>`}
        const tags=[];
        if(e.fast)tags.push(`<span class="tag bad">換把 ${e.move} 個半音，只有 ${e.gap.toFixed(2)} 秒</span>`);
        else if(e.move)tags.push(`<span class="tag${e.big?' warn':''}">換把 ${e.move} 個半音</span>`);
        if(e.heldBreak)tags.push('<span class="tag warn">持續音得換弦重彈</span>');
        tags.push(`<span class="tag">${r.pos?`把位 ${r.pos}`:'空弦位'}</span>`);
        if(r.fingers>1)tags.push(`<span class="tag">${r.fingers} 指</span>`);
        if(r.barre)tags.push('<span class="tag">橫按</span>');
        if(e.style)tags.push(`<span class="tag${e.style.startsWith('跳')?' warn':''}">${e.style}</span>`);
        if(e.held.length)tags.push(`<span class="tag">持續音 ${e.held.map(m=>jp(m)).join(' ')}</span>`);
        status=e.issue?'<span class="pill bad">要注意</span>':'';
        detail=`<div class="vstr" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cells}</div><div class="tags">${tags.join('')}</div>`;
      }
      if(e.sugg&&e.sugg.length)detail+=`<div class="sugg"><b>可以這樣改：</b>${e.sugg.map(s=>`<span>${s.text}（${s.v.r.pos?`把位 ${s.v.r.pos}`:'空弦位'}，${s.v.r.fingers} 指）</span>`).join('')}</div>`;
      else if(!e.chosen&&e.midis.length&&!e.res.unreach.length)detail+=`<div class="sugg"><span>移動或省略單一個音都還是按不到，建議改寫這個和弦或分給其他聲部。</span></div>`;
      const ids=e.midis.length>=3?identify(e.midis.map(m=>m%12)):[];
      const nameTxt=ids.length?`<span class="meta">${degHTML(ids[0].root-st.key)}${TYPES[ids[0].k].s}</span>`:'';
      h+=`<button class="srow${i===st.scoreSel?' sel':''}${e.issue?' bad':''}" data-ev="${i}"><span class="no beat">拍 ${beat}</span><span class="body"><span class="top">${e.midis.map(m=>jp(m)).join(' ')} ${nameTxt} ${status}</span>${detail}</span></button>`;
    });
    if(!shown)h+='<p class="empty">沒有需要注意的地方，整個聲部都按得到。</p>';
    el.innerHTML=h+'</div>';
  }else{
    const r=current.r,snd=st.free.map((f,i)=>f>=0?(st.strings[i]+f)%12:null).filter(x=>x!==null);
    const ids=identify(snd);
    el.innerHTML=`${ids.length?`<div class="cname">${ids.slice(0,3).map(x=>`<span>${chordName(x.root,x.k)}${x.omit?'<small>（省略五音）</small>':''}</span>`).join('<small>或</small>')}</div>`:snd.length>1?'<p class="meta">這組音不是常見和弦</p>':''}
      ${r.ok?`<div class="status ok"><span class="big">按得到</span><span class="meta" style="font-weight:400">${r.fingers} 指${r.span?`・跨度 ${r.span}`:''}${r.barre?'・橫按':''}</span></div>`
      :`<div class="status bad"><span class="big">按不到</span></div><ul class="probs">${r.probs.map(p=>`<li>${p}</li>`).join('')}</ul>`}`;
  }
}

/* ---------- 事件 ---------- */
function setStrings(arr,preset){st.strings=arr;st.preset=preset;st.free=arr.map(()=>0);st.picks=st.picks.filter(()=>true);st.selIdx=0;st.minSound=Math.min(st.minSound,arr.length);renderSetup();render()}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='preset'){if(PRESETS[t.value])setStrings(PRESETS[t.value].slice(),t.value);else{st.preset='自訂';save()}return}
  if(t.id==='key'){st.key=+t.value;render();return}
  if(t.id==='nameMode'){st.nameMode=t.value;render();return}
  if(t.id==='moveWarn'){const v=parseInt(t.value);if(!isNaN(v)){st.moveWarn=v;render()}return}
  if(t.id==='seqText')return;
  if(t.id==='scoreFile'){if(t.files&&t.files[0])loadScoreFile(t.files[0]);return}
  if(t.id==='partIdx'){st.partIdx=+t.value;st.scoreSel=0;applyPartPreset();render();return}
  if(t.id==='scoreInst'){if(PRESETS[t.value])setStrings(PRESETS[t.value].slice(),t.value);return}
  if(t.id==='xOct'){st.xOct=+t.value;st.scoreSel=0;render();return}
  if(t.id==='tempo'){const v=parseFloat(t.value);if(v>0){st.tempo=v;render()}return}
  if(t.id==='fastGap'){const v=parseFloat(t.value);if(v>0){st.fastGap=v;render()}return}
  if(t.id==='onlyIssues'){st.onlyIssues=t.checked;render();return}
  if(t.dataset.str!==undefined){st.strings[+t.dataset.str]=+t.value;st.preset='自訂';$('#preset').value='自訂';st.selIdx=0;render();return}
  if(['maxSpan','cross','maxFingers','minSound','maxFret'].includes(t.id)){const v=parseFloat(t.value);if(!isNaN(v)){st[t.id]=v;st.selIdx=0;render()}return}
  if(['barre','skipInner','rootBass','omit5'].includes(t.id)){st[t.id]=t.checked;st.selIdx=0;render()}
});
document.addEventListener('toggle',e=>{if(e.target.id==='rules'){st.rulesOpen=e.target.open;save()}},true);
let seqTimer;
document.addEventListener('input',e=>{
  if(e.target.id!=='seqText')return;
  st.seqText=e.target.value;clearTimeout(seqTimer);
  seqTimer=setTimeout(()=>{current={items:solveSeq()};if(st.seqSel>=current.items.length)st.seqSel=0;
    const it=current.items[st.seqSel];current.sel=it?.chosen?.frets||null;current.seqNotes=it?it.notes:[];
    renderBoard();renderRes();save()},250);
});
function applyPickText(){
  const inp=$('#pickTxt');if(!inp)return;
  const p=parseNotes(inp.value);
  if(p.bad.length){st.pickErr=`無法辨認：${p.bad.join('、')}。音名請寫成 G4、Bb4、C#5，簡譜請寫成 3、5、1'。`;render();return}
  if(p.notes.length>N()){st.pickErr=`輸入了 ${p.notes.length} 個音，但只有 ${N()} 條弦。`;render();return}
  st.pickErr='';st.picks=p.notes;st.selIdx=0;render();
}
document.addEventListener('keydown',e=>{if(e.target.id==='pickTxt'&&e.key==='Enter'){e.preventDefault();applyPickText()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='addStr'){const top=Math.max(...st.strings);setStrings([...st.strings,Math.min(84,top+5)],'自訂');return}
  if(b.id==='rmStr'){setStrings(st.strings.slice(0,-1),'自訂');return}
  if(b.dataset.tab){st.tab=b.dataset.tab;st.selIdx=0;render();return}
  if(b.dataset.root){st.root=+b.dataset.root;st.selIdx=0;render();pluck(60+st.key+st.root);return}
  if(b.dataset.type){st.type=b.dataset.type;st.selIdx=0;render();return}
  if(b.dataset.pick){const m=+b.dataset.pick;const i=st.picks.indexOf(m);
    if(i>=0)st.picks.splice(i,1);else if(st.picks.length<N()){st.picks.push(m);pluck(m)}
    st.selIdx=0;render();return}
  if(b.id==='clearPicks'){st.picks=[];st.pickErr='';render();return}
  if(b.id==='applyTxt'){applyPickText();return}
  if(b.id==='playAll'){playScore(0);return}
  if(b.id==='playFrom'){playScore(st.scoreSel||0);return}
  if(b.id==='stopPlay'){stopPlay();return}
  if(b.id==='loadSample'){useScore(parseMusicXML(sampleXML()),'範例樂譜（柳琴，4 小節）');return}
  if(b.dataset.ev!==undefined){st.scoreSel=+b.dataset.ev;const sc=$('#bscroll')?.scrollTop;
    const e=current.ana.ev[st.scoreSel];current.sel=e?.chosen?.frets||null;current.seqNotes=e?e.midis:[];
    renderBoard();document.querySelectorAll('.srow.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
    save();strum(current.sel);scrollToSel(sc);return}
  if(b.id==='playSeq'){playSeq(current.items||[]);return}
  if(b.dataset.seq!==undefined){st.seqSel=+b.dataset.seq;const sc=$('#bscroll')?.scrollTop;
    current.sel=current.items[st.seqSel]?.chosen?.frets||null;current.seqNotes=current.items[st.seqSel]?.notes||[];
    renderBoard();renderRes();save();strum(current.sel);scrollToSel(sc);return}
  if(b.id==='allOpen'){st.free=st.strings.map(()=>0);render();return}
  if(b.id==='allMute'){st.free=st.strings.map(()=>-1);render();return}
  if(b.id==='play'){strum(current.sel);return}
  if(b.dataset.v!==undefined){st.selIdx=+b.dataset.v;const sc=$('#bscroll')?.scrollTop;render();strum(current.sel);scrollToSel(sc);return}
  if(b.dataset.head!==undefined){const i=+b.dataset.head;const base=(st.tab==='free'?st.free:(current.sel||st.strings.map(()=>-1))).slice();base[i]=base[i]===-1?0:-1;st.free=base;st.tab='free';render();return}
  if(b.dataset.cell){const [i,f]=b.dataset.cell.split(',').map(Number);
    const sc=$('#bscroll').scrollTop;
    const base=(st.tab==='free'?st.free:(current.sel||st.strings.map(()=>-1))).slice();
    base[i]=base[i]===f?-1:f;st.free=base;st.tab='free';render();$('#bscroll').scrollTop=sc;
    if(base[i]>=0)pluck(st.strings[i]+f);return}
});
function scrollToSel(prev){
  const sc=$('#bscroll');if(!sc)return;sc.scrollTop=prev||0;
  const on=[...sc.querySelectorAll('.c.on')];if(!on.length)return;
  const rows=on.map(x=>x.offsetTop);const top=Math.min(...rows),bot=Math.max(...rows)+40;
  if(top<sc.scrollTop+40||bot>sc.scrollTop+sc.clientHeight)sc.scrollTop=Math.max(0,top-80);
}
renderSetup();render();
</script>
